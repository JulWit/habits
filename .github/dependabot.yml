# Dependabot tracks the Go dependencies and reports new versions as a pull
# request. A PR rather than a bare notification, because it brings the change
# with it: go.mod and go.sum are already adjusted, leaving the reading and the
# merging.
version: 2

updates:
  - package-ecosystem: gomod
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "07:00"
      timezone: Europe/Berlin

    # One PR for all Go updates rather than ten separate ones. Apart from
    # golang.org/x/sys, the indirect dependencies all come out of the
    # dependency tree of modernc.org/sqlite and move in lockstep; separate PRs
    # would be the same work ten times over.
    groups:
      go:
        patterns:
          - "*"

    # With grouping there is usually only one PR open anyway. The limit only
    # bites when an update gets stuck and the next week has already arrived.
    open-pull-requests-limit: 3

    commit-message:
      prefix: deps
